<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueueFlow — Loket Petugas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0b1220', panel: '#121a2b', raised: '#182238', line: '#223049',
            ink: '#e8ecf3', muted: '#7c8aa5', teal: '#2dd4bf', amber: '#f5a623',
          },
          fontFamily: {
            sans: ['IBM Plex Sans', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-bg text-ink font-sans">
  <div class="scanline"></div>
  <div id="app" class="min-h-screen flex flex-col" v-cloak>

    <header class="border-b border-line px-6 py-4 flex items-baseline justify-between">
      <h1 class="font-mono text-lg tracking-tight">QueueFlow<span class="text-teal">_</span> <span class="text-muted text-base">loket petugas</span></h1>
      <nav class="flex gap-4 text-sm font-mono">
        <a href="/" class="text-muted hover:text-teal">kiosk</a>
        <span class="text-teal">loket petugas</span>
        <a href="/display.html" class="text-muted hover:text-teal">papan panggil</a>
      </nav>
    </header>

    <main class="flex-1 px-6 py-8 max-w-xl mx-auto w-full">

      <div v-if="!setup" class="max-w-sm mx-auto">
        <h2 class="text-lg font-medium mb-4">Masuk sebagai loket</h2>
        <label class="block text-muted text-sm mb-1">Poli</label>
        <select v-model="dept" class="btn w-full mb-4">
          <option value="" disabled>Pilih poli…</option>
          <option v-for="d in departments" :key="d.code" :value="d.code">{{ d.name }}</option>
        </select>
        <label class="block text-muted text-sm mb-1">Nomor loket</label>
        <input v-model="counter" placeholder="misal: 1" class="btn w-full mb-6" />
        <button class="btn btn--primary w-full" :disabled="!dept || !counter" @click="setup = true">
          Mulai bertugas
        </button>
      </div>

      <div v-else>
        <p class="text-muted text-sm mb-1">{{ deptName }} · Loket {{ counter }}</p>

        <div class="ticket mt-3">
          <div class="ticket__notch ticket__notch--left"></div>
          <div class="ticket__notch ticket__notch--right"></div>
          <div class="px-6 py-8 text-center">
            <template v-if="current">
              <p class="text-muted text-sm mb-1">Sedang dipanggil</p>
              <p class="font-mono text-5xl font-semibold text-teal">{{ current.number }}</p>
              <span class="badge mt-3" :class="current.priority ? 'badge--priority' : 'badge--normal'">
                {{ current.priority ? 'Prioritas' : 'Reguler' }}
              </span>
            </template>
            <p v-else class="text-muted py-4">Belum ada pasien dipanggil</p>
          </div>
          <div class="perforation perforation--panel"></div>
          <div class="px-6 py-4 flex gap-3">
            <button class="btn btn--primary flex-1" :disabled="busy || current" @click="panggilBerikutnya">
              Panggil berikutnya
            </button>
            <button class="btn btn--danger" :disabled="busy || !current" @click="selesai">
              Selesai
            </button>
          </div>
        </div>

        <p v-if="notice" class="text-muted text-sm mt-4 font-mono">{{ notice }}</p>

        <div v-if="otherCounters.length" class="mt-6 text-left">
          <p class="text-muted text-xs uppercase tracking-wide mb-2">Loket lain aktif di poli ini</p>
          <ul class="text-sm font-mono space-y-1">
            <li v-for="s in otherCounters" :key="s.counter" class="text-muted">
              Loket {{ s.counter }} — {{ s.ticket.number }}
            </li>
          </ul>
        </div>

        <button class="text-muted text-sm mt-8 hover:text-ink" @click="setup = false">← ganti loket / poli</button>
      </div>

    </main>
  </div>

  <script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
  <script src="/js/counter.js"></script>
</body>
</html>
